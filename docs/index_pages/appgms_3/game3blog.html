<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Game Blog</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap');

        :root {
            --bg-color: #e5e5e5;
            --text-color: #000000;
            --accent-color: #ff3333;
            --circle-size: 320px;
        }

        body {
            margin: 0;
            overflow: hidden; /* Hide scrollbars for the game mode */
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            user-select: none;
            touch-action: none;
        }

        /* --- BACKGROUND LAYER --- */
        #bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            background-color: var(--bg-color);
        }

        #bg-text {
            font-size: 8vw;
            font-weight: 900;
            color: var(--text-color);
            line-height: 0.85;
            text-transform: uppercase;
            text-align: justify;
            letter-spacing: -0.02em;
            pointer-events: none; /* Let clicks pass through to the wrapper */
            width: 110vw; /* Slight overflow to ensure full coverage */
        }

        /* --- GAME MODE STYLES --- */
        #game-container {
            position: fixed;
            width: var(--circle-size);
            height: var(--circle-size);
            border-radius: 50%;
            border: 4px solid var(--text-color);
            background: rgba(229, 229, 229, 0.9);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            /* Flex center is used to cluster words initially before JS takes over */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .word-link {
            position: absolute; /* Needed for JS physics positioning */
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-color);
            text-transform: uppercase;
            padding: 8px 12px;
            cursor: pointer;
            background: rgba(255,255,255,0.7);
            border: 2px solid var(--text-color);
            border-radius: 4px;
            transition: color 0.2s, background-color 0.2s, transform 0.2s;
            white-space: nowrap;
        }

        .word-link:hover {
            background-color: var(--text-color);
            color: #ffffff;
            transform: scale(1.1);
            z-index: 20;
        }

        /* --- STATIC MODE STYLES --- */
        body.is-static {
            overflow-y: auto;
            touch-action: auto;
        }

        body.is-static #bg-layer {
            opacity: 0.1; /* Dim background in static mode to focus on content */
        }

        body.is-static #game-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: auto;
            min-height: 100vh;
            margin: 0 auto;
            border-radius: 0;
            border: none;
            background: transparent;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 4rem 1rem;
            overflow: visible;
        }

        body.is-static .word-link {
            position: static !important; /* Force override JS inline styles */
            transform: none !important;
            width: 100%;
            text-align: center;
            padding: 1.5rem;
            font-size: 1.5rem;
            background: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        body.is-static .word-link:hover {
            transform: translateY(-4px) !important;
            box-shadow: 0 10px 15px rgba(0,0,0,0.2);
        }

        /* --- READER MODAL (TOP 50%) --- */
        #reader-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50vh;
            background-color: #ffffff;
            border-bottom: 6px solid var(--text-color);
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none; /* Hidden by default */
            flex-direction: column;
            overflow-y: auto;
            padding: 2rem;
            box-sizing: border-box;
            cursor: default; /* Reset cursor from the background */
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        #close-btn {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 900;
            cursor: pointer;
            color: var(--text-color);
            background: none;
            border: none;
            padding: 0;
            transition: color 0.2s, transform 0.2s;
        }

        #close-btn:hover {
            color: var(--accent-color);
            transform: scale(1.2);
        }

        #reader-title {
            font-size: 2.5rem;
            font-weight: 900;
            margin: 0 0 1rem 0;
            text-transform: uppercase;
            letter-spacing: -0.03em;
        }

        #reader-content {
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 800px;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- Background text that acts as the static mode toggle -->
    <div id="bg-layer" title="Click anywhere to toggle static mode">
        <div id="bg-text"></div>
    </div>

    <!-- The Top-Half Reader Area -->
    <div id="reader-modal">
        <button id="close-btn" title="Close reading area">X</button>
        <h1 id="reader-title">Title</h1>
        <div id="reader-content">Content goes here.</div>
    </div>

    <!-- The Game Circle and Link Words -->
    <div id="game-container">
        <div class="word-link" data-id="thoughts">Thoughts</div>
        <div class="word-link" data-id="essays">Essays</div>
        <div class="word-link" data-id="poetry">Poetry</div>
        <div class="word-link" data-id="manifesto">Manifesto</div>
    </div>

    <script>
        // --- 1. POPULATE MASSIVE BACKGROUND TEXT ---
        const bgTextElement = document.getElementById('bg-text');
        const repeatedString = "I DO NOT WANT TO PLAY THE GAME. ";
        // Repeat enough times to absolutely fill any modern screen
        bgTextElement.textContent = repeatedString.repeat(250);

        // --- 2. DUMMY BLOG DATA ---
        const blogPosts = {
            "thoughts": {
                title: "Why I don't play",
                content: "Games are a distraction from the crushing weight of reality. We chase pixels and high scores to avoid confronting the silence of our own existence. I prefer the stillness. I prefer the raw, ungamified experience of just being."
            },
            "essays": {
                title: "The Illusion of Choice",
                content: "In modern interactive media, you are given a set of predetermined paths. They call it freedom, but it is merely a slightly wider cage. True freedom is walking away from the keyboard, stepping outside, and realizing there are no objective markers or quest logs in the real world."
            },
            "poetry": {
                title: "Ode to the Static",
                content: "Moving targets.<br>Flashing lights.<br>A desperate plea for dopamine.<br>I close my eyes.<br>The screen goes dark.<br>Finally, peace."
            },
            "manifesto": {
                title: "The Anti-Game Manifesto",
                content: "Article 1: Movement is an illusion. We expend energy digitally while physically decaying.<br>Article 2: Engagement is a trap designed by those who commodify our attention.<br>Article 3: By refusing to play, we win the only game that matters: reclaiming our time."
            }
        };

        // --- 3. STATE & DOM ELEMENTS ---
        let isGameMode = true;
        let animationFrameId;
        
        const bgLayer = document.getElementById('bg-layer');
        const gameContainer = document.getElementById('game-container');
        const readerModal = document.getElementById('reader-modal');
        const readerTitle = document.getElementById('reader-title');
        const readerContent = document.getElementById('reader-content');
        const closeBtn = document.getElementById('close-btn');
        
        const wordElements = document.querySelectorAll('.word-link');
        const circleSize = 320;
        const radius = circleSize / 2;

        // Circle Physics State (Extremely Slow)
        let cx = window.innerWidth / 2 - radius;
        let cy = window.innerHeight / 2 - radius;
        let cvx = 0.4;
        let cvy = 0.5;

        // Word Physics State
        let words = [];

        function initWords() {
            words = Array.from(wordElements).map(el => {
                const rect = el.getBoundingClientRect();
                return {
                    el,
                    w: rect.width || 100,
                    h: rect.height || 40,
                    // Start in the middle of the circle
                    x: radius - (rect.width || 100) / 2 + (Math.random() * 20 - 10),
                    y: radius - (rect.height || 40) / 2 + (Math.random() * 20 - 10),
                    // Extremely slow velocities
                    vx: (Math.random() > 0.5 ? 1 : -1) * (0.1 + Math.random() * 0.3),
                    vy: (Math.random() > 0.5 ? 1 : -1) * (0.1 + Math.random() * 0.3)
                };
            });
        }

        // --- 4. PHYSICS ENGINE ---
        function updatePhysics() {
            if (!isGameMode) return;

            // 1. Update Container (Circle) position
            cx += cvx;
            cy += cvy;

            // Bounce off window edges
            if (cx <= 0) { cx = 0; cvx *= -1; }
            else if (cx + circleSize >= window.innerWidth) { cx = window.innerWidth - circleSize; cvx *= -1; }

            if (cy <= 0) { cy = 0; cvy *= -1; }
            else if (cy + circleSize >= window.innerHeight) { cy = window.innerHeight - circleSize; cvy *= -1; }

            gameContainer.style.transform = `translate(${cx}px, ${cy}px)`;

            // 2. Update Words inside the Circle
            const center_x = radius;
            const center_y = radius;

            words.forEach(wd => {
                wd.x += wd.vx;
                wd.y += wd.vy;

                // Simple Box vs Circle collision approximation
                // Check all 4 corners of the word against the radius
                const corners = [
                    { x: wd.x, y: wd.y },
                    { x: wd.x + wd.w, y: wd.y },
                    { x: wd.x, y: wd.y + wd.h },
                    { x: wd.x + wd.w, y: wd.y + wd.h }
                ];

                let maxDist = 0;
                let furthestCorner = corners[0];

                for (let c of corners) {
                    let dx = c.x - center_x;
                    let dy = c.y - center_y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > maxDist) {
                        maxDist = dist;
                        furthestCorner = c;
                    }
                }

                // If the furthest corner breaches the circle boundary
                if (maxDist > radius - 4) { // -4 for border offset
                    // Calculate normal vector
                    let nx = -(center_x - furthestCorner.x) / maxDist;
                    let ny = -(center_y - furthestCorner.y) / maxDist;

                    let dot = wd.vx * nx + wd.vy * ny;

                    // Reflect velocity
                    if (dot > 0) {
                        wd.vx = wd.vx - 2 * dot * nx;
                        wd.vy = wd.vy - 2 * dot * ny;
                    }

                    // Push back inside
                    let overlap = maxDist - (radius - 4);
                    wd.x -= nx * overlap;
                    wd.y -= ny * overlap;
                }

                wd.el.style.left = `${wd.x}px`;
                wd.el.style.top = `${wd.y}px`;
            });
        }

        function gameLoop() {
            if (isGameMode) {
                updatePhysics();
            }
            // We keep the loop running conceptually, but only update DOM if isGameMode is true
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- 5. EVENT HANDLERS & LOGIC ---
        
        function toggleStaticMode(e) {
            // Prevent bubbling if necessary, though this is on the lowest layer
            if (e) e.stopPropagation();

            isGameMode = !isGameMode;

            if (!isGameMode) {
                document.body.classList.add('is-static');
                // Clear inline JS styles so CSS can take over standard layout
                gameContainer.style.cssText = '';
                words.forEach(wd => wd.el.style.cssText = '');
            } else {
                document.body.classList.remove('is-static');
                // Reset positions to center to prevent them spawning out of bounds
                cx = window.innerWidth / 2 - radius;
                cy = window.innerHeight / 2 - radius;
                
                words.forEach(wd => {
                    wd.x = radius - wd.w / 2 + (Math.random() * 20 - 10);
                    wd.y = radius - wd.h / 2 + (Math.random() * 20 - 10);
                });
            }
        }

        function openArticle(e) {
            // Prevent background click from firing
            e.stopPropagation();
            
            const id = e.target.getAttribute('data-id');
            const post = blogPosts[id];

            if (post) {
                readerTitle.textContent = post.title;
                readerContent.innerHTML = post.content; // using innerHTML to parse simple <br> tags
                readerModal.style.display = 'flex';
            }
        }

        function closeArticle(e) {
            // Prevent background click from firing
            e.stopPropagation();
            readerModal.style.display = 'none';
        }

        // Event Listeners
        bgLayer.addEventListener('click', toggleStaticMode);
        
        wordElements.forEach(word => {
            word.addEventListener('click', openArticle);
        });

        closeBtn.addEventListener('click', closeArticle);
        
        // Ensure clicking inside the reader modal doesn't toggle static mode or close the modal
        readerModal.addEventListener('click', (e) => e.stopPropagation());
        
        // Same for the game container itself, clicking the empty space in the circle shouldn't toggle background
        gameContainer.addEventListener('click', (e) => e.stopPropagation());

        // Keep circle in bounds on resize if in game mode
        window.addEventListener('resize', () => {
            if (!isGameMode) return;
            if (cx + circleSize > window.innerWidth) cx = window.innerWidth - circleSize;
            if (cy + circleSize > window.innerHeight) cy = window.innerHeight - circleSize;
            if (cx < 0) cx = 0;
            if (cy < 0) cy = 0;
        });

        // Initialize and start loop
        window.onload = () => {
            initWords();
            gameLoop();
        };

    </script>
</body>
</html>
